name: Build
on:
  - push
  - pull_request

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  NAME: rssbot

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    strategy:
      matrix:
        GOOS: [windows, linux, darwin]
        GOARCH: [amd64, 386, arm, arm64]
        exclude:
          - GOOS: windows
            GOARCH: arm
          - GOOS: darwin
            GOARCH: 386
          - GOOS: darwin
            GOARCH: arm

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Build
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
        run: go build -ldflags="-s -w" -o "dist/${NAME}-${GOOS}-${GOARCH}"

      - name: Rename binaries (Windows)
        if: matrix.GOOS == 'windows'
        run: for x in dist/"${NAME}"-windows-*; do mv "$x" "$x.exe"; done

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.NAME }}-${{ matrix.GOOS }}-${{ matrix.GOARCH }}-${{ github.sha }}
          path: dist/*
          retention-days: 90

  docker:
    name: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push image to ghcr.io

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build . --file Dockerfile --tag "$NAME" --build-arg VERSION="${GITHUB_SHA::7}" --label "runnumber=${GITHUB_RUN_ID}"

      - name: Log in to registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: |
          image_id="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=latest
          fi
          echo "Pushing ${image_id}:${version}"
          docker tag "$NAME" "${image_id}:${version}"
          docker push "${image_id}:${version}"
